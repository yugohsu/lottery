<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="抽獎轉盤">
<meta name="theme-color" content="#eaf2ff">
<title>抽獎轉盤</title>
<style>
  :root{--bg:#eaf2ff;--card:#fff;--ink:#12285c;--muted:#51648f;--line:#c9d9f5;--main:#1f5fd6;--main2:#ffc928;--ok:#1f5fd6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
  body{padding:max(14px,env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
  .wrap{max-width:760px;margin:0 auto}
  button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  h1{margin:4px 0 2px;font-size:30px;font-weight:900}
  .dates{font-size:20px;font-weight:800;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sel{width:100%;font:inherit;font-size:20px;font-weight:900;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:10px}
  .lbl{margin:16px 0 8px;font-size:18px;font-weight:900;color:var(--muted)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .chip{flex:none;font-size:19px;font-weight:900;min-height:54px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .chip small{display:block;font-size:14px;font-weight:800;color:var(--muted)}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff}
  .chip.on small{color:#fff}
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  .tab{font-size:20px;font-weight:900;min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .tab small{display:block;font-size:14px;color:var(--muted)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab.on small{color:#fff}
  .stage{position:relative;width:min(92vw,560px);aspect-ratio:1;margin:18px auto 6px}
  canvas{width:100%;height:100%;display:block}
  .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:40px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4vw,24px);font-weight:900;text-align:center;line-height:1.1}
  .go{display:block;width:100%;max-width:560px;margin:10px auto 0;border:0;border-radius:22px;background:var(--main2);color:var(--ink);font-size:34px;font-weight:900;padding:22px 8px;box-shadow:0 6px 0 #d19f00}
  .go:disabled{opacity:.55}
  .left{text-align:center;font-size:18px;font-weight:800;color:var(--muted);margin-top:10px}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:19px;font-weight:900}
  .tog{min-width:84px;min-height:52px;border-radius:26px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:900;color:var(--muted)}
  .tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .hist{margin-top:10px}
  .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);margin-top:8px;font-size:20px;font-weight:900}
  .h small{font-size:15px;color:var(--muted);font-weight:800}
  .btn2{display:block;width:100%;margin-top:10px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:900;color:var(--ink)}
  .msg{font-size:18px;font-weight:800;color:var(--muted);margin-top:8px;text-align:center}
  .over{position:fixed;inset:0;background:rgba(43,33,24,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  .over[hidden]{display:none}
  .box{background:#fff;border-radius:28px;padding:26px 22px;text-align:center;width:min(92vw,520px)}
  .box .t{font-size:22px;font-weight:900;color:var(--muted)}
  .box .w{font-size:clamp(48px,14vw,84px);font-weight:900;color:var(--main);background:#fff6cf;border-radius:20px;padding:8px 6px;margin:10px 0 18px;line-height:1.15;word-break:break-all}
  .box .ok{width:100%;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:26px;font-weight:900;padding:16px}
  .box input{width:100%;font:inherit;font-size:28px;font-weight:900;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);margin:12px 0}
  .tours{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .tour{font-size:20px;font-weight:900;min-height:60px;padding:6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .tour.on{background:var(--main);border-color:var(--main);color:#fff}
  .secs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .sec{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:21px;font-weight:900}
  .sec.on{background:var(--main2);border-color:var(--main2)}
  .copy{display:block;width:100%;margin-top:10px;min-height:60px;border-radius:16px;border:0;background:var(--main);color:#fff;font-size:22px;font-weight:900}
  .del{color:#c0392b;border-color:#f0b7b0}
  .undo{display:block;width:100%;max-width:560px;margin:12px auto 0;min-height:58px;border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:22px;font-weight:900}
  .undo:disabled{opacity:.35}
  .box .t.big{font-size:40px;color:var(--ink);text-align:center}
  .empty{text-align:center;font-size:20px;font-weight:900;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="lbl">團名</div>
  <div class="tours" id="tours"></div>

  <div class="lbl">抽哪一組</div>
  <div class="tabs" id="tabs"></div>

  <div class="stage" id="stage">
    <div class="pin"></div>
    <canvas id="wheel" width="1120" height="1120"></canvas>
    <div class="hub" id="hub">抽獎</div>
  </div>
  <button class="go" id="go">開始抽獎</button>
  <button class="undo" id="undo" disabled>恢復上一動作</button>
  <div class="left" id="left"></div>

  <div class="lbl">轉盤轉幾秒</div>
  <div class="secs" id="secs"><button class="sec" data-sec="1">1 秒</button><button class="sec" data-sec="3">3 秒</button></div>

  <div class="opt"><span>抽過刪除</span><button class="tog on" id="noRepeat">開</button></div>

  <div class="lbl">中獎紀錄</div>
  <div class="hist" id="hist"></div>
  <button class="copy" id="copyWin">複製得獎名單（貼到 LINE）</button>

  <button class="btn2" id="reload">更新名單</button>
  <button class="btn2" id="clear">清除這一團的中獎紀錄</button>
  <button class="btn2 del" id="delTour">刪除這一團的名單（用完了）</button>
  <button class="btn2" id="pinBtn">更換 PIN</button>
  <div class="msg" id="msg"></div>
</div>

<div class="over" id="winBox" hidden>
  <div class="box">
    <div class="t big">恭喜</div>
    <div class="w" id="winName"></div>
    <button class="ok" id="winOk">關閉</button>
  </div>
</div>

<div class="over" id="pinBox" hidden>
  <div class="box">
    <div class="t">請輸入 PIN（跟下雨通知一樣）</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off">
    <button class="ok" id="pinOk">確定</button>
  </div>
</div>

<script>
(function () {
  const API = 'https://script.google.com/macros/s/AKfycbwGL9LSy0zDw0fS83oVSOL-RSoce7PQUjJQgvs216_TqxmF3VEbNTH7yOlSiEV9mc6dWg/exec?lottery=1';
  const $ = id => document.getElementById(id);
  const WD = '日一二三四五六';
  const BLUES = ['#1f5fd6', '#3b7ff0', '#173f9e'], YELLOWS = ['#ffc928', '#ffdc6b', '#f5b400'];
  const S = { pin: '', tours: [], data: null, tab: 'adults', angle: 0, spinning: false };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  S.pin = store.get('lt_pin', '');

  async function api(body) {
    body.pin = S.pin;
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.msg || '讀取失敗');
    return j;
  }
  function say(t) { $('msg').textContent = t || ''; }
  function parse(s) { const p = String(s || '').split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /* ---------- 名單（只有大人、小孩） ---------- */
  function lists() {
    const d = S.data;
    if (!d) return [];
    return [{ id: 'adults', name: '大人', list: d.adults || [] }, { id: 'kids', name: '小孩', list: d.kids || [] }].filter(x => x.list.length);
  }
  function histKey() { return 'lt_hist_' + (S.data ? S.data.key : ''); }
  function hist() { return store.get(histKey(), []); }
  function curList() { return lists().find(x => x.id === S.tab) || lists()[0]; }
  function remaining() {
    const L = curList();
    if (!L) return [];
    if (!store.get('lt_norep', true)) return L.list.slice();
    const won = new Set(hist().filter(h => h.list === L.name).map(h => h.who));
    return L.list.filter(n => !won.has(n));
  }

  /* ---------- 恢復上一動作（防誤點） ---------- */
  const UNDO = [];
  function pushUndo(u) { UNDO.push(u); if (UNDO.length > 30) UNDO.shift(); $('undo').disabled = false; }
  function undo() {
    if (S.spinning) return;
    const u = UNDO.pop();
    if (u) {
      if (u.type === 'draw' || u.type === 'clear') store.set(u.key, u.hist);
      else if (u.type === 'norep') store.set('lt_norep', u.val);
      else if (u.type === 'sec') store.set('lt_sec', u.val);
      else if (u.type === 'delete') {
        const d = u.data;
        api({ action: 'save', tour: d.tour, start: d.start, end: d.end, adults: d.adults, kids: d.kids, groups: d.groups || [] })
          .then(() => init()).then(() => say('已恢復：' + u.label)).catch(e => say('恢復失敗：' + e.message));
        $('undo').disabled = !UNDO.length;
        return;
      }
      if (u.tourKey && (!S.data || S.data.key !== u.tourKey)) { loadTour(u.tourKey).catch(() => {}); }
      else renderAll();
      say(u.label ? '已恢復：' + u.label : '已恢復上一動作');
    }
    $('undo').disabled = !UNDO.length;
  }

  /* ---------- 畫轉盤 ---------- */
  function draw() {
    const c = $('wheel'), g = c.getContext('2d'), W = c.width, R = W / 2 - 8;
    const names = remaining();
    g.clearRect(0, 0, W, W);
    g.save();
    g.translate(W / 2, W / 2);
    g.rotate(S.angle);
    if (!names.length) {
      g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fillStyle = '#dbe6f8'; g.fill();
      g.restore();
      $('hub').textContent = '抽完了';
      return;
    }
    const n = names.length, a = Math.PI * 2 / n;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.moveTo(0, 0);
      g.arc(0, 0, R, i * a - Math.PI / 2, (i + 1) * a - Math.PI / 2);
      g.closePath();
      let yellow = i % 2 === 1;
      let col = yellow ? YELLOWS[((i - 1) / 2) % 3] : BLUES[(i / 2) % 3];
      if (n % 2 === 1 && i === n - 1 && n > 1) { col = '#9cc2ff'; yellow = true; }
      g.fillStyle = col;
      g.fill();
      g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke();
      g.save();
      g.rotate(i * a + a / 2 - Math.PI / 2);
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      g.fillStyle = yellow ? '#12285c' : '#fff';
      const fs = Math.max(26, Math.min(64, Math.floor(R * a * 0.62), Math.floor(R * 0.62 / Math.max(2, names[i].length) * 1.05)));
      g.font = '900 ' + fs + 'px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
      g.fillText(names[i], R - 26, 0);
      g.restore();
    }
    g.restore();
    g.beginPath(); g.arc(W / 2, W / 2, R, 0, Math.PI * 2); g.lineWidth = 10; g.strokeStyle = '#12285c'; g.stroke();
    $('hub').textContent = '抽獎';
  }

  function spin() {
    if (S.spinning) return;
    const names = remaining();
    if (!names.length) { say('這一組都抽完了'); return; }
    const n = names.length, a = Math.PI * 2 / n;
    const pick = Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * n);
    const jitter = (Math.random() - 0.5) * a * 0.7;
    const base = -(pick * a + a / 2) + jitter;
    const cur = ((S.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let target = S.angle - cur + base;
    const sec = store.get('lt_sec', 3) === 1 ? 1 : 3;
    while (target < S.angle + Math.PI * 2 * (sec === 1 ? 2 : 5)) target += Math.PI * 2;
    const from = S.angle, dur = sec * 1000, t0 = performance.now();
    S.spinning = true;
    $('go').disabled = true;
    $('undo').disabled = true;
    const ease = t => 1 - Math.pow(1 - t, 4);
    (function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      S.angle = from + (target - from) * ease(t);
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        S.spinning = false;
        $('go').disabled = false;
        const who = names[pick];
        const L = curList();
        const h = hist();
        pushUndo({ type: 'draw', key: histKey(), hist: h.slice(), tourKey: S.data.key, label: '取消 ' + who + ' 的中獎' });
        h.unshift({ who: who, list: L.name, at: Date.now() });
        store.set(histKey(), h.slice(0, 300));
        $('winName').textContent = who;
        $('winBox').hidden = false;
      }
    })(t0);
  }

  /* ---------- 畫面 ---------- */
  function renderHead() {
    const d = S.data;
    $('tours').innerHTML = S.tours.map(t => '<button class="tour' + (d && t.key === d.key ? ' on' : '') + '" data-tour="' + esc(t.key) + '">' + esc(t.tour || t.key) + '</button>').join('');
    const L = lists();
    if (!L.some(x => x.id === S.tab) && L[0]) S.tab = L[0].id;
    const tn = d ? (d.tour || '') : '';
    $('tabs').innerHTML = L.map(x => '<button class="tab' + (x.id === S.tab ? ' on' : '') + '" data-tab="' + x.id + '">' + esc(tn ? tn + ' ' + x.name : x.name) + '<small>' + x.list.length + '人</small></button>').join('');
  }
  function renderAll() {
    renderHead();
    const r = remaining(), L = curList();
    $('left').textContent = L ? L.name + '還有 ' + r.length + ' 人可以抽（共 ' + L.list.length + ' 人）' : '';
    const nr = store.get('lt_norep', true);
    $('noRepeat').classList.toggle('on', nr);
    $('noRepeat').textContent = nr ? '開' : '關';
    const sec = store.get('lt_sec', 3) === 1 ? 1 : 3;
    Array.from(document.querySelectorAll('[data-sec]')).forEach(b => b.classList.toggle('on', Number(b.dataset.sec) === sec));
    $('delTour').style.display = S.data ? '' : 'none';
    const h = hist();
    $('hist').innerHTML = h.length ? h.map(x => '<div class="h"><span>' + esc(x.who) + '</span><small>' + esc(x.list) + '</small></div>').join('') : '<div class="empty">還沒有人中獎</div>';
    draw();
  }

  async function loadTour(key) {
    say('讀取名單中…');
    const j = await api({ action: 'get', key: key });
    S.data = j.data;
    store.set('lt_last', key);
    store.set('lt_cache_' + key, j.data);
    say('名單更新時間：' + (j.data.updated || ''));
    renderAll();
  }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function pickDefault() {
    const last = store.get('lt_last', '');
    if (S.tours.some(t => t.key === last)) return last;
    const today = ymd(new Date());
    const live = S.tours.find(t => t.start && t.start <= today && (t.end || t.start) >= today);
    if (live) return live.key;
    const up = S.tours.filter(t => t.start >= today).sort((a, b) => a.start.localeCompare(b.start))[0];
    if (up) return up.key;
    return S.tours[0] ? S.tours[0].key : '';
  }
  async function init() {
    if (!S.pin) { askPin(); return; }
    try {
      say('讀取中…');
      const j = await api({ action: 'list' });
      S.tours = j.tours || [];
      if (!S.tours.length) { S.data = null; renderAll(); say('還沒有任何抽獎名單，請先在 Excel 按「上傳到轉盤」'); return; }
      const key = (S.data && S.tours.some(t => t.key === S.data.key)) ? S.data.key : pickDefault();
      await loadTour(key);
    } catch (e) {
      if (/PIN|pin|密碼/.test(e.message)) { say('PIN 不對，請重新輸入'); askPin(); return; }
      const last = store.get('lt_last', '');
      const c = last ? store.get('lt_cache_' + last, null) : null;
      if (c) { S.data = c; S.tours = [{ key: c.key, tour: c.tour, start: c.start }]; renderAll(); say('沒有網路，先用上次的名單（' + (c.updated || '') + '）'); }
      else say('讀取失敗：' + e.message);
    }
  }
  function askPin() { $('pinIn').value = ''; $('pinBox').hidden = false; setTimeout(() => $('pinIn').focus(), 50); }

  /* ---------- 按鈕 ---------- */
  $('go').onclick = spin;
  $('hub').onclick = spin;
  $('undo').onclick = undo;
  $('winOk').onclick = () => { $('winBox').hidden = true; renderAll(); };
  $('tours').onclick = e => { const b = e.target.closest('[data-tour]'); if (b && !S.spinning && (!S.data || b.dataset.tour !== S.data.key)) { S.angle = 0; loadTour(b.dataset.tour).catch(err => say('讀取失敗：' + err.message)); } };
  $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b && !S.spinning) { S.tab = b.dataset.tab; S.angle = 0; renderAll(); } };
  $('noRepeat').onclick = () => { const v = store.get('lt_norep', true); pushUndo({ type: 'norep', val: v, label: '抽過刪除 ' + (v ? '開' : '關') }); store.set('lt_norep', !v); renderAll(); };
  $('reload').onclick = () => init();
  $('clear').onclick = () => { if (!S.data) return; if (confirm('確定清除「' + (S.data.tour || '') + '」的中獎紀錄？')) { pushUndo({ type: 'clear', key: histKey(), hist: hist(), tourKey: S.data.key, label: '清除的中獎紀錄' }); store.set(histKey(), []); renderAll(); } };
  $('secs').onclick = e => { const b = e.target.closest('[data-sec]'); if (!b) return; const v = store.get('lt_sec', 3); const nv = Number(b.dataset.sec); if (v === nv) return; pushUndo({ type: 'sec', val: v, label: '轉盤 ' + v + ' 秒' }); store.set('lt_sec', nv); renderAll(); };
  $('copyWin').onclick = async () => {
    const h = hist().slice().reverse();
    if (!h.length) { say('還沒有人中獎'); return; }
    const lines = [(S.data && S.data.tour ? S.data.tour + ' ' : '') + '抽獎得獎名單'];
    ['大人', '小孩'].forEach(name => {
      const w = h.filter(x => x.list === name);
      if (!w.length) return;
      lines.push('', name);
      w.forEach((x, i) => lines.push((i + 1) + '. ' + x.who));
    });
    const text = lines.join('\n');
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
    if (!ok) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }
    $('copyWin').textContent = ok ? '已複製，可以貼到 LINE' : '複製失敗，請再按一次';
    setTimeout(() => { $('copyWin').textContent = '複製得獎名單（貼到 LINE）'; }, 2000);
  };
  $('delTour').onclick = async () => {
    if (!S.data || S.spinning) return;
    const d = S.data;
    if (!confirm('確定刪除「' + (d.tour || '') + '」的名單？\n（刪錯可以按「恢復上一動作」救回來）')) return;
    try {
      await api({ action: 'delete', key: d.key });
      pushUndo({ type: 'delete', data: JSON.parse(JSON.stringify(d)), label: '刪除的「' + (d.tour || '') + '」名單' });
      try { localStorage.removeItem('lt_cache_' + d.key); } catch (e) {}
      if (store.get('lt_last', '') === d.key) store.set('lt_last', '');
      S.data = null;
      await init();
      say('已刪除「' + (d.tour || '') + '」的名單');
    } catch (e) { say('刪除失敗：' + e.message); }
  };
  $('pinBtn').onclick = askPin;
  $('pinOk').onclick = () => { S.pin = $('pinIn').value.trim(); store.set('lt_pin', S.pin); $('pinBox').hidden = true; init(); };
  $('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinOk').click(); });

  renderAll();
  init();
})();
</script>
</body>
</html>
